name: Anigma CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anigma-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find js vendor -type f -name '*.js' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript files were found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate manifest and local script references
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          console.log('manifest.webmanifest: valid JSON');

          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/<script\\b[^>]*\\bsrc=["']([^"']+)["']/gi)]
            .map(match => match[1])
            .filter(src => !/^(?:https?:)?\\/\\//i.test(src) && !/^(?:data:|blob:)/i.test(src));

          for (const src of refs) {
            const clean = decodeURIComponent(src.split(/[?#]/, 1)[0]).replace(/^\\.\\//, '');
            const localPath = clean.startsWith('/') ? clean.slice(1) : clean;
            if (!fs.existsSync(path.resolve(localPath))) {
              throw new Error(`Missing local script: ${src}`);
            }
          }
          console.log(`Checked ${refs.length} local script reference(s).`);
          NODE

      - name: Verify Service Worker SHA-256 pins
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const source = fs.readFileSync('service-worker.js', 'utf8');
          const match = source.match(/const INTEGRITY = \\{([\\s\\S]*?)\\n\\};/);
          if (!match) throw new Error('Could not find the INTEGRITY map in service-worker.js');

          const entries = [...match[1].matchAll(/^\\s*'([^']+)'\\s*:\\s*'([a-f0-9]{64})',?\\s*$/gm)];
          if (entries.length === 0) throw new Error('No SHA-256 entries were found');

          for (const [, relativePath, expected] of entries) {
            const absolutePath = path.resolve(relativePath);
            if (!absolutePath.startsWith(process.cwd() + path.sep)) {
              throw new Error(`Unsafe integrity path: ${relativePath}`);
            }
            if (!fs.existsSync(absolutePath)) {
              throw new Error(`Integrity target is missing: ${relativePath}`);
            }
            const actual = crypto.createHash('sha256').update(fs.readFileSync(absolutePath)).digest('hex');
            if (actual !== expected) {
              throw new Error(`SHA-256 mismatch for ${relativePath}: expected ${expected}, got ${actual}`);
            }
            console.log(`Verified ${relativePath}`);
          }

          console.log(`Verified ${entries.length} Service Worker integrity pin(s).`);
          NODE
